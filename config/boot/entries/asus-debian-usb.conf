# Live image on a USB stick. qcom_q6v5_pas stays blacklisted while root is on USB.
title Debian ASUS A14 - Glymur 18-core (USB)
sort-key 00-asus
linux /asus-debian/linux.efi
devicetree /asus-debian/asus-ux3407na.dtb
initrd /asus-debian/initrd
options root=UUID=<rootfs-uuid> rw clk_ignore_unused pd_ignore_unused regulator_ignore_unused deferred_probe_timeout=30 consoleblank=0 modprobe.blacklist=qcom_q6v5_pas systemd.unit=multi-user.target
