# Installed system: LUKS2 root on NVMe (see /etc/crypttab), Plymouth splash.
title Debian ASUS A14 - Glymur 18-core
sort-key 00-asus
linux /asus-debian/linux.efi
devicetree /asus-debian/asus-ux3407na.dtb
initrd /asus-debian/initrd
options root=/dev/mapper/cryptroot rw clk_ignore_unused pd_ignore_unused regulator_ignore_unused deferred_probe_timeout=30 consoleblank=0 quiet splash
